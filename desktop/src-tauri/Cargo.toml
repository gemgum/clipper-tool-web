[package]
name = "clipper-desktop"
version = "0.12.0"
description = "Clipper — long videos into 9:16 clips"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

# Jendela ini tidak melakukan apa pun selain membuka satu alamat, jadi tidak ada
# plugin Tauri sama sekali. Semua kemampuan aplikasi ada di engine Go.

[profile.release]
opt-level = "s"
lto = true
strip = true
