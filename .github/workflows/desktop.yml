# Membangun pemasang aplikasi desktop.
#
# Ada di sini, bukan di mesin sendiri, karena pemasang Windows (.msi) hanya bisa
# dibuat DI Windows — WiX dan penandatanganan tidak ada di sistem lain. Dengan
# alur ini, pemilik proyek tidak perlu memasang Visual Studio Build Tools 3 GB
# untuk sekadar menghasilkan satu berkas .msi.
#
# Dijalankan dengan tangan (workflow_dispatch) atau saat sebuah tag versi
# didorong — bukan setiap push: satu kali jalan memakan belasan menit di dua
# sistem sekaligus.

name: desktop

on:
  # Dipertahankan: memeriksa pengemasan masih jalan tidak sama dengan merilis,
  # dan yang pertama jauh lebih sering dibutuhkan.
  workflow_dispatch:
  push:
    tags: ["v*"]

# Wajib untuk `gh release create`; tanpa ini ditolak 403. Hanya contents,
# tidak lebih — alur ini tidak menyentuh apa pun selain rilis.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: ubuntu-22.04
            name: linux
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # Pustaka sistem WebKitGTK — hanya perlu di Linux; Windows memakai
      # WebView2 yang sudah ada bawaan.
      - name: Pustaka Linux
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev \
            librsvg2-dev libssl-dev libayatana-appindicator3-dev

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          # Engine ini standard library saja — tidak ada go.sum, jadi tidak ada
          # yang bisa (atau perlu) di-cache.
          cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: dtolnay/rust-toolchain@stable

      # Cache Rust: kompilasi pertama ~400 paket dan itu bagian terlama di
      # seluruh alur ini.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      # Engine + antarmuka statis harus jadi LEBIH DULU: keduanya ikut dikemas
      # sebagai resource oleh Tauri (lihat desktop/src-tauri/tauri.conf.json).
      # Nomor versi ada di dua tempat yang tidak saling tahu: nama tag, dan
      # tauri.conf.json (yang menentukan nama .msi serta entri di Add/Remove
      # Programs). Kalau berbeda, pemasang bernama versi lama — dan itu baru
      # ketahuan setelah dibagikan.
      - name: Versi tag cocok dengan tauri.conf.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          conf=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          if [ "$tag" != "$conf" ]; then
            echo "::error::tag $GITHUB_REF_NAME tidak cocok dengan tauri.conf.json ($conf) — samakan dulu, lalu tandai ulang"
            exit 1
          fi
          echo "versi $conf"

      - name: Engine (Go)
        working-directory: engine
        shell: bash
        run: |
          # Versi engine mengikuti tag saat merilis, supaya banner `clipper
          # serve` menyebut versi yang sama dengan yang tertulis di pemasang.
          v="${GITHUB_REF_NAME}"
          case "$v" in v*) v="${v#v}" ;; *) v="dev-${GITHUB_SHA::7}" ;; esac
          out="../bin/clipper${{ matrix.name == 'windows' && '.exe' || '' }}"
          go build -ldflags "-X main.version=$v" -o "$out" ./cmd/clipper

      # Font subtitle tidak ikut di-commit (lihat .gitignore), padahal ia
      # dibundel ke dalam pemasang. Tanpa langkah ini pengemasan berhenti
      # dengan "resource path assets\fonts doesn't exist".
      - name: Font subtitle
        shell: bash
        run: ./fetch-fonts.sh

      - name: Antarmuka (statis)
        working-directory: gui
        run: |
          npm ci
          npm run build

      - name: Pemasang (Tauri)
        working-directory: desktop
        run: |
          npm ci
          npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: clipper-${{ matrix.name }}
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: warn
          # Repo private hanya dapat 500 MB penyimpanan artifact, sedangkan tiap
          # build menyimpan pemasang untuk dua sistem. Pemasang lama tidak ada
          # gunanya disimpan — yang dipakai selalu yang terbaru.
          retention-days: 7

  # Menempelkan pemasang ke halaman Releases, dengan NAMA TETAP.
  #
  # Nama tetap itu syarat mati untuk tautan
  # /releases/latest/download/<nama> yang dipakai situs: Tauri menamai
  # keluarannya dengan versi di dalamnya (Clipper_0.1.0_x64-setup.exe), jadi
  # kalau diunggah apa adanya, tautan situs harus disunting tiap rilis — dan
  # akan mati diam-diam kalau lupa.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest # rilisnya cuma menyalin berkas; mesin Windows 2x lebih mahal
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Beri nama tetap
        run: |
          mkdir -p dist
          pick() { # pick <pola> <nama tetap>
            f=$(find artifacts -type f -name "$1" | head -1)
            if [ -z "$f" ]; then
              echo "::warning::tidak ada berkas yang cocok dengan $1"
              return
            fi
            cp "$f" "dist/$2"
            echo "  $(basename "$f")  ->  $2"
          }
          pick '*-setup.exe' Clipper-setup.exe
          pick '*.msi' Clipper.msi
          pick '*.AppImage' Clipper.AppImage
          pick '*.deb' Clipper.deb
          echo
          ls -lh dist
          # Pemasang Windows itu yang ditautkan situs. Rilis tanpa dia bukan
          # rilis yang setengah jadi — ia rilis yang membuat tombol unduh mati.
          [ -f dist/Clipper-setup.exe ] || {
            echo "::error::pemasang Windows tidak ikut terbangun — rilis dibatalkan"
            exit 1
          }

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Clipper $GITHUB_REF_NAME" \
            --generate-notes
