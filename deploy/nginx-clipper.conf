# Clipper (web) — engine di 127.0.0.1:8787, lihat /etc/systemd/system/clipper.service
server {
    server_name klip.sarthlutions.id;

    # Video sumber 1–4 jam bisa berukuran beberapa GB.
    client_max_body_size 10G;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Unggahan GB dialirkan langsung ke engine, tidak ditampung dulu di disk nginx.
        proxy_request_buffering off;
        # SSE (progres job) harus langsung diteruskan.
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/klip.sarthlutions.id/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/klip.sarthlutions.id/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = klip.sarthlutions.id) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name klip.sarthlutions.id;
    return 404; # managed by Certbot


}